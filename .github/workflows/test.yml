name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the extension parses
        run: node --check content.js
      - name: Check the manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json'))"
      - name: Unit tests
        run: node test.js
